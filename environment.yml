# Conda environment for the ALS_RNAseq orchestration scripts.
#
#   conda env create -f environment.yml
#   conda activate als_rnaseq
#
# These scripts only *orchestrate* the pipeline -- nf-core/rnaseq itself runs on
# Nextflow Tower / AWS Batch, so no aligners (STAR, RSEM, samtools) are needed
# locally. Everything here is pure Python from PyPI
#
# Python is pinned because py-orca requires >=3.10,<3.12.
# 3.10 reaches end-of-life in October 2026, so used 3.11 instead.
#
# Requires conda on PATH -- see the Prerequisite section in README.md for the
# Miniforge install.
name: als_rnaseq
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - py-orca==1.5.3
      - synapseclient==4.14.0
      - requests==2.34.2
      - boto3==1.42.97
      - pyyaml==6.0.3
      # split_merged_matrics_by_study.py only
      - pandas==3.0.2
      - numpy==2.4.4
      # Visualization tools
      - jupyterlab==4.6.4
      - matplotlib==3.11.2
      - seaborn==0.12.2

